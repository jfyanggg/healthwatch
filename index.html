<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pantry Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101012;
    --bg-elevated: #1B1B1E;
    --paper: #F5F0E6;
    --ink: #F2F2F0;
    --ink-dim: #86868B;
    --line: #2A2A2E;
    --protein: #E7E7E5;
    --fiber: #9A9A9E;
    --calorie: #FFFFFF;
    --over: #A85248;
    --good: #5FA463;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101012; --bg-elevated: #1B1B1E; --paper: #F5F0E6; --ink: #F2F2F0;
      --ink-dim: #86868B; --line: #2A2A2E; --protein: #E7E7E5; --fiber: #9A9A9E;
      --calorie: #FFFFFF; --over: #A85248; --good: #5FA463;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101012; --bg-elevated: #1B1B1E; --paper: #F5F0E6; --ink: #F2F2F0;
    --ink-dim: #86868B; --line: #2A2A2E; --protein: #E7E7E5; --fiber: #9A9A9E;
    --calorie: #FFFFFF; --over: #A85248; --good: #5FA463;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    -webkit-text-size-adjust: 100%;
    touch-action: pan-y;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    touch-action: pan-y;
  }
  button {
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 48px;
  }
  .datebar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 6px 0 26px;
  }
  .datebar button {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
  }
  .datebar button:hover { border-color: var(--ink-dim); }
  .datebar button:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .datebar .daylabel {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    min-width: 168px;
    text-align: center;
  }
  .datebar .daylabel small {
    display: block;
    color: var(--ink-dim);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.72rem;
    margin-top: 1px;
  }

  /* --- hero: rings --- */
  .jars {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 22px 4px 6px;
    margin-bottom: 8px;
  }
  .jar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .jar-figure {
    width: 96px;
    height: 96px;
    position: relative;
  }
  .jar-figure svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    transform: rotate(-90deg);
  }
  .ring-track {
    fill: none;
    stroke: var(--bg-elevated);
    stroke-width: 10;
  }
  .jar-fill {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 301.59;
    stroke-dashoffset: 301.59;
    will-change: stroke-dashoffset;
    transition: stroke-dashoffset 0.6s cubic-bezier(.32,.94,.4,1), stroke 0.3s;
  }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  .jar-num {
    font-variant-numeric: tabular-nums;
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.1;
  }
  .jar-target {
    font-size: 0.62rem;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .jar-label {
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    margin-top: 8px;
  }

  .sticky-top {
    position: -webkit-sticky;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 5;
    padding-top: 14px;
    padding-bottom: 6px;
    margin-bottom: 4px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.3;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .chip:active { transform: scale(0.96); background: var(--line); }
  .chip .chip-macro {
    font-size: 0.68rem;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  details.entry-details summary {
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--ink-dim);
    list-style: none;
    touch-action: manipulation;
  }
  details.entry-details summary::-webkit-details-marker { display: none; }
  details.entry-details summary::before {
    content: "+ Log something new";
  }
  details.entry-details[open] summary { margin-bottom: 14px; }

  @keyframes entryIn {
    from { opacity: 0; transform: translateY(-8px); background: rgba(255,255,255,0.06); }
    to { opacity: 1; transform: translateY(0); background: transparent; }
  }
  .entry-enter {
    animation: entryIn 0.5s ease;
  }
  section {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    margin-top: 16px;
  }
  h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1rem;
    margin: 0 0 12px;
    color: var(--ink);
  }

  form.entry {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .row3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  input {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 11px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    width: 100%;
    font-variant-numeric: tabular-nums;
    -webkit-appearance: none;
    appearance: none;
  }
  input::placeholder { color: var(--ink-dim); opacity: 0.8; }
  .field-label {
    font-size: 0.66rem;
    color: var(--ink-dim);
    margin-bottom: 4px;
    display: block;
  }
  button.primary {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 2px;
  }
  button.primary:hover { filter: brightness(0.92); }

  ul.log {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.log li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  ul.log li:last-child { border-bottom: none; }
  .entry-name {
    font-size: 0.92rem;
    color: var(--ink);
  }
  .entry-macros {
    font-size: 0.76rem;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .entry-left { min-width: 0; flex: 1; }
  button.del {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    flex-shrink: 0;
  }
  button.del:hover { color: var(--over); }

  .empty {
    color: var(--ink-dim);
    font-size: 0.85rem;
    font-style: italic;
    padding: 6px 0 2px;
  }

  details.targets summary {
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--ink-dim);
    list-style: none;
    touch-action: manipulation;
  }
  details.targets summary::-webkit-details-marker { display: none; }
  details.targets summary::before {
    content: "Adjust targets ";
  }
  details.targets[open] summary::before { content: "Adjust targets "; }
  .targets-form {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .targets-form button {
    grid-column: 1 / -1;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 9px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  @media (min-width: 480px) {
    .jars { gap: 22px; }
    .jar-figure { width: 128px; height: 128px; }
    .jar-num { font-size: 1.2rem; }
    .jar-target { font-size: 0.68rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="sticky-top">
    <div class="datebar">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <div class="daylabel" id="dayLabel"></div>
      <button id="nextDay" aria-label="Next day">›</button>
    </div>

    <div class="jars" id="jars">
      <div class="jar-col">
        <div class="jar-figure">
          <svg viewBox="0 0 116 116">
            <circle class="ring-track" cx="58" cy="58" r="48"></circle>
            <circle class="jar-fill" id="fillCal" cx="58" cy="58" r="48" stroke="var(--calorie)"></circle>
          </svg>
          <div class="ring-center">
            <div class="jar-num" id="numCal">0</div>
            <div class="jar-target" id="targetCalLabel">/ 0</div>
          </div>
        </div>
        <div class="jar-label">calories</div>
      </div>
      <div class="jar-col">
        <div class="jar-figure">
          <svg viewBox="0 0 116 116">
            <circle class="ring-track" cx="58" cy="58" r="48"></circle>
            <circle class="jar-fill" id="fillProtein" cx="58" cy="58" r="48" stroke="var(--protein)"></circle>
          </svg>
          <div class="ring-center">
            <div class="jar-num" id="numProtein">0g</div>
            <div class="jar-target" id="targetProteinLabel">/ 0g</div>
          </div>
        </div>
        <div class="jar-label">protein</div>
      </div>
      <div class="jar-col">
        <div class="jar-figure">
          <svg viewBox="0 0 116 116">
            <circle class="ring-track" cx="58" cy="58" r="48"></circle>
            <circle class="jar-fill" id="fillFiber" cx="58" cy="58" r="48" stroke="var(--fiber)"></circle>
          </svg>
          <div class="ring-center">
            <div class="jar-num" id="numFiber">0g</div>
            <div class="jar-target" id="targetFiberLabel">/ 0g</div>
          </div>
        </div>
        <div class="jar-label">fiber</div>
      </div>
    </div>

    <details class="targets">
      <summary></summary>
      <form class="targets-form" id="targetsForm">
        <div>
          <span class="field-label">Calories</span>
          <input type="number" id="tCal" inputmode="numeric" min="0">
        </div>
        <div>
          <span class="field-label">Protein (g)</span>
          <input type="number" id="tProtein" inputmode="numeric" min="0">
        </div>
        <div>
          <span class="field-label">Fiber (g)</span>
          <input type="number" id="tFiber" inputmode="numeric" min="0">
        </div>
        <button type="submit">Save targets</button>
      </form>
    </details>
  </div>

  <section id="quickSection" style="display:none;">
    <h2>Log again</h2>
    <div class="chips" id="quickChips"></div>
  </section>

  <section>
    <details class="entry-details" id="entryDetails">
      <summary></summary>
      <form class="entry" id="entryForm">
        <div>
          <span class="field-label">What was it?</span>
          <input type="text" id="eName" placeholder="e.g. canned tuna">
        </div>
        <div class="row3">
          <div>
            <span class="field-label">Calories</span>
            <input type="number" id="eCal" inputmode="numeric" min="0">
          </div>
          <div>
            <span class="field-label">Protein (g)</span>
            <input type="number" id="eProtein" inputmode="decimal" min="0">
          </div>
          <div>
            <span class="field-label">Fiber (g)</span>
            <input type="number" id="eFiber" inputmode="decimal" min="0">
          </div>
        </div>
        <button type="submit" class="primary">+ Log it</button>
      </form>
    </details>
  </section>

  <section>
    <h2>Today's log</h2>
    <ul class="log" id="logList"></ul>
    <div class="empty" id="emptyMsg" style="display:none;">Nothing logged yet — add your first item above.</div>
  </section>
</div>

<script>
(function() {
  document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
  var STORE_KEY = 'pantry-ledger-data-v1';
  var DEFAULT_TARGETS = { calories: 2000, protein: 190, fiber: 30 };

  function loadData() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return { targets: Object.assign({}, DEFAULT_TARGETS), days: {} };
      var parsed = JSON.parse(raw);
      if (!parsed.targets) parsed.targets = Object.assign({}, DEFAULT_TARGETS);
      if (!parsed.days) parsed.days = {};
      return parsed;
    } catch (e) {
      return { targets: Object.assign({}, DEFAULT_TARGETS), days: {} };
    }
  }

  function saveData(data) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } catch (e) {
      console.error('Could not save', e);
    }
  }

  var data = loadData();
  var viewDate = new Date();
  viewDate.setHours(0,0,0,0);

  function dateKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function isToday(d) {
    var t = new Date(); t.setHours(0,0,0,0);
    return dateKey(d) === dateKey(t);
  }

  var WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function renderDateLabel() {
    var label = document.getElementById('dayLabel');
    var sub = isToday(viewDate) ? 'today' : '';
    label.innerHTML = WEEKDAYS[viewDate.getDay()] + ', ' + MONTHS[viewDate.getMonth()] + ' ' + viewDate.getDate() +
      (sub ? '<small>' + sub + '</small>' : '<small>&nbsp;</small>');
  }

  function getEntries() {
    var k = dateKey(viewDate);
    return data.days[k] || [];
  }

  function setEntries(entries) {
    var k = dateKey(viewDate);
    data.days[k] = entries;
    saveData(data);
  }

  function totals(entries) {
    return entries.reduce(function(acc, e) {
      acc.calories += Number(e.calories) || 0;
      acc.protein += Number(e.protein) || 0;
      acc.fiber += Number(e.fiber) || 0;
      return acc;
    }, { calories: 0, protein: 0, fiber: 0 });
  }

  function pct(value, target) {
    if (!target || target <= 0) return 0;
    var p = (value / target) * 100;
    return Math.max(0, Math.min(100, p));
  }

  var RING_CIRC = 301.59; // 2 * PI * r(48)

  function setRing(el, value, target, colorVar, reachedColorVar) {
    var p = pct(value, target);
    el.style.strokeDashoffset = RING_CIRC * (1 - p / 100);
    var reached = target > 0 && value >= target;
    el.setAttribute('stroke', reached ? 'var(' + reachedColorVar + ')' : 'var(' + colorVar + ')');
  }

  function renderJars() {
    var entries = getEntries();
    var t = totals(entries);
    var targets = data.targets;

    document.getElementById('numCal').textContent = Math.round(t.calories).toLocaleString();
    document.getElementById('targetCalLabel').textContent = '/ ' + targets.calories.toLocaleString();
    setRing(document.getElementById('fillCal'), t.calories, targets.calories, '--calorie', '--over');

    document.getElementById('numProtein').textContent = Math.round(t.protein) + 'g';
    document.getElementById('targetProteinLabel').textContent = '/ ' + targets.protein + 'g';
    setRing(document.getElementById('fillProtein'), t.protein, targets.protein, '--protein', '--good');

    document.getElementById('numFiber').textContent = Math.round(t.fiber) + 'g';
    document.getElementById('targetFiberLabel').textContent = '/ ' + targets.fiber + 'g';
    setRing(document.getElementById('fillFiber'), t.fiber, targets.fiber, '--fiber', '--good');
  }

  function renderLog() {
    var entries = getEntries();
    var list = document.getElementById('logList');
    var empty = document.getElementById('emptyMsg');
    list.innerHTML = '';
    if (entries.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    entries.slice().reverse().forEach(function(e) {
      var li = document.createElement('li');
      if (e.id === lastAddedId) {
        li.className = 'entry-enter';
      }
      var left = document.createElement('div');
      left.className = 'entry-left';
      var name = document.createElement('div');
      name.className = 'entry-name';
      name.textContent = e.name || 'Unnamed item';
      var macros = document.createElement('div');
      macros.className = 'entry-macros';
      macros.textContent = Math.round(e.calories) + ' cal · ' + e.protein + 'g protein · ' + e.fiber + 'g fiber';
      left.appendChild(name);
      left.appendChild(macros);
      var del = document.createElement('button');
      del.className = 'del';
      del.setAttribute('aria-label', 'Delete entry');
      del.textContent = '×';
      del.addEventListener('click', function() {
        var current = getEntries();
        setEntries(current.filter(function(x) { return x.id !== e.id; }));
        renderAll();
      });
      li.appendChild(left);
      li.appendChild(del);
      list.appendChild(li);
    });
    lastAddedId = null;
  }

  var lastAddedId = null;

  function addEntry(name, cal, protein, fiber) {
    if (!name && cal === 0 && protein === 0 && fiber === 0) return;
    var entries = getEntries();
    var id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    entries.push({ id: id, name: name, calories: cal, protein: protein, fiber: fiber });
    setEntries(entries);
    lastAddedId = id;
    renderAll();
  }

  function getQuickItems() {
    var map = {};
    Object.keys(data.days).forEach(function(k) {
      data.days[k].forEach(function(e, idx) {
        if (!e.name) return;
        var key = e.name.trim().toLowerCase();
        if (!key) return;
        if (!map[key]) map[key] = { name: e.name, calories: e.calories, protein: e.protein, fiber: e.fiber, count: 0, order: 0 };
        map[key].count += 1;
        map[key].calories = e.calories;
        map[key].protein = e.protein;
        map[key].fiber = e.fiber;
        map[key].order = k + '-' + idx;
      });
    });
    return Object.keys(map).map(function(k) { return map[k]; })
      .sort(function(a, b) {
        if (b.count !== a.count) return b.count - a.count;
        return a.order < b.order ? 1 : -1;
      })
      .slice(0, 8);
  }

  function renderQuickChips() {
    var quick = getQuickItems();
    var section = document.getElementById('quickSection');
    var wrap = document.getElementById('quickChips');
    wrap.innerHTML = '';
    if (quick.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    quick.forEach(function(item) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      var label = document.createElement('span');
      label.textContent = item.name;
      var macro = document.createElement('span');
      macro.className = 'chip-macro';
      macro.textContent = Math.round(item.calories) + ' cal · ' + item.protein + 'g P · ' + item.fiber + 'g F';
      btn.appendChild(label);
      btn.appendChild(macro);
      btn.addEventListener('click', function() {
        addEntry(item.name, item.calories, item.protein, item.fiber);
      });
      wrap.appendChild(btn);
    });
  }

  function renderTargetsForm() {
    document.getElementById('tCal').value = data.targets.calories;
    document.getElementById('tProtein').value = data.targets.protein;
    document.getElementById('tFiber').value = data.targets.fiber;
  }

  function renderAll() {
    renderDateLabel();
    renderJars();
    renderLog();
    renderQuickChips();
  }

  document.getElementById('prevDay').addEventListener('click', function() {
    viewDate.setDate(viewDate.getDate() - 1);
    renderAll();
  });
  document.getElementById('nextDay').addEventListener('click', function() {
    viewDate.setDate(viewDate.getDate() + 1);
    renderAll();
  });

  document.getElementById('entryForm').addEventListener('submit', function(ev) {
    ev.preventDefault();
    var name = document.getElementById('eName').value.trim();
    var cal = parseFloat(document.getElementById('eCal').value) || 0;
    var protein = parseFloat(document.getElementById('eProtein').value) || 0;
    var fiber = parseFloat(document.getElementById('eFiber').value) || 0;
    addEntry(name, cal, protein, fiber);
    ev.target.reset();
  });

  document.getElementById('targetsForm').addEventListener('submit', function(ev) {
    ev.preventDefault();
    data.targets = {
      calories: parseFloat(document.getElementById('tCal').value) || DEFAULT_TARGETS.calories,
      protein: parseFloat(document.getElementById('tProtein').value) || DEFAULT_TARGETS.protein,
      fiber: parseFloat(document.getElementById('tFiber').value) || DEFAULT_TARGETS.fiber
    };
    saveData(data);
    document.querySelector('details.targets').removeAttribute('open');
    renderAll();
  });

  renderTargetsForm();
  renderAll();
  if (getQuickItems().length === 0) {
    document.getElementById('entryDetails').setAttribute('open', '');
  }
})();
</script>
